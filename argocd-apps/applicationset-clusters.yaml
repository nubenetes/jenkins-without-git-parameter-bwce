# ==============================================================================
# ArgoCD ApplicationSet: Multi-Cluster Environment Generator for TIBCO BWCE
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bwce-multicluster-workloads
  namespace: argocd
spec:
  generators:
    # Cluster Generator: Discovers registered OpenShift clusters by environment label
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: "tibco-bwce-order-service-{{metadata.labels.environment}}"
      namespace: argocd
      labels:
        environment: "{{metadata.labels.environment}}"
        app.kubernetes.io/managed-by: argocd
        workload-type: tibco-bwce
    spec:
      project: default
      source:
        repoURL: https://github.com/nubenetes/jenkins-without-git-parameter-bwce.git
        targetRevision: main
        path: "sample-apps/tibco-bwce-order-service/k8s/overlays/{{metadata.labels.environment}}"
      destination:
        server: "{{server}}"
        namespace: "nubenetes-{{metadata.labels.environment}}-bwce"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
