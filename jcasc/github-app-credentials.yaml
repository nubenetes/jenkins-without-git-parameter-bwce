# ==============================================================================
# JCasC Credentials: GitHub App Authentication for BWCE SCM & GitOps PRs
# ==============================================================================
credentials:
  system:
    domainCredentials:
      - credentials:
          - gitHubApp:
              id: "github-app-gitops"
              description: "GitHub App for BWCE Multibranch SCM Discovery & Automated GitOps PRs"
              appID: "${GITHUB_APP_ID:-123456}"
              privateKey: "${GITHUB_APP_PRIVATE_KEY:-}"
          - usernamePassword:
              id: "openshift-registry-credentials"
              description: "OpenShift Internal Image Registry ServiceAccount Token"
              username: "serviceaccount"
              password: "${OPENSHIFT_REGISTRY_TOKEN:-}"
              scope: GLOBAL
          - string:
              id: "datadog-api-key"
              description: "Datadog API Key for CI Visibility & APM"
              secret: "${DATADOG_API_KEY:-}"
              scope: GLOBAL
