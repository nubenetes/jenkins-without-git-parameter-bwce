appId: tibco-bwce-customer-api
applicationName: "com.nubenetes.bwce.customer.api"
containerPort: 8080
engineMonitoringPort: 8090
healthCheckPath: /health
livenessProbePath: /health
readinessProbePath: /health
metricsPath: /metrics
bwceProfileName: "DEV.substvar"
jvmOptions: >-
  -XX:+UseContainerSupport
  -XX:MaxRAMPercentage=75.0
  -XX:+UseG1GC
  -XX:+ExplicitGCInvokesConcurrent
  -javaagent:/opt/datadog/dd-java-agent.jar
  -Ddd.service=tibco-bwce-customer-api
  -Ddd.logs.injection=true
  -Ddd.profiling.enabled=true
engineThreadCount: 16
stepFlowLimit: 50
logLevel: INFO
